; Dev settings. The source is bind-mounted from the host, where each file stat is slow
; (especially on Windows), so cache compiled files and resolved paths aggressively.
memory_limit = 512M
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
